<div class="welcome-page">
  <div class="welcome-bg">
    <div class="welcome-particles">
      <span class="particle particle--1"></span>
      <span class="particle particle--2"></span>
      <span class="particle particle--3"></span>
      <span class="particle particle--4"></span>
      <span class="particle particle--5"></span>
    </div>
  </div>

  <div class="welcome-container">
    <div class="welcome-card animate-fade-in-up">
      <div class="welcome-logo">
        <img src="assets/Logo.png" alt="Bab Al Awir" class="welcome-logo__img animate-bounce-in" />
      </div>

      <h1 class="welcome-title animate-fade-in-up delay-1">{{ "welcomeTitle" | translate }}</h1>
      <p class="welcome-subtitle animate-fade-in-up delay-2">{{ "welcomeSubtitle" | translate }}</p>

      <div class="welcome-form animate-fade-in-up delay-3">
        <label class="welcome-label" for="region">{{ "welcomeRegionLabel" | translate }}</label>
        <select id="region" class="welcome-select" [(ngModel)]="selectedRegion">
          <option value="" disabled>{{ "welcomeRegionLabel" | translate }}</option>
          @for (r of regions(); track r.code) {
            <option [value]="r.code">{{ regionName(r) }}</option>
          }
        </select>

        <label class="welcome-label" for="lang">{{ "welcomeLangLabel" | translate }}</label>
        <select id="lang" class="welcome-select" [ngModel]="selectedLang" (ngModelChange)="onLangChange($event)">
          @for (l of languages(); track l.code) {
            <option [value]="l.code">{{ langName(l) }}</option>
          }
        </select>

        @if (error()) {
          <p class="welcome-error animate-shake">{{ error() | translate }}</p>
        }

        <button class="welcome-btn animate-fade-in-up delay-4" type="button" (click)="proceed()">
          {{ "welcomeProceed" | translate }}
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>

      <div class="welcome-features animate-fade-in-up delay-5">
        <div class="welcome-feature">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="17" r="1"/>
            <circle cx="19" cy="17" r="1"/>
            <path d="M2 17h20M9 17V7c0-2.5 2-4.5 4.5-4.5S18 4.5 18 7v10"/>
          </svg>
          <span>{{ "welcomeFeatureDelivery" | translate }}</span>
        </div>
        <div class="welcome-feature">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          <span>{{ "welcomeFeatureFresh" | translate }}</span>
        </div>
        <div class="welcome-feature">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>{{ "welcomeFeaturePayment" | translate }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
