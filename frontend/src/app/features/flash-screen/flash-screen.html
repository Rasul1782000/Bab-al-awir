<div class="flash-screen">
  <div class="flash-screen__bg"></div>
  <div class="flash-screen__content">
    <div class="flash-screen__logo animate-fade-in-up">
      <img src="assets/Logo.png" alt="Bab Al Awir" />
    </div>
    <h1 class="flash-screen__title animate-fade-in-up delay-1">{{ "flashTitle" | translate }}</h1>
    <p class="flash-screen__subtitle animate-fade-in-up delay-2">{{ "flashSubtitle" | translate }}</p>
    <div class="flash-screen__bar animate-fade-in-up delay-3">
      <div class="flash-screen__bar-fill"></div>
    </div>
  </div>
</div>
