<app-auth-shell>
  <h2 class="auth-title">{{ "forgotTitle" | translate }}</h2>
  <p class="auth-subtitle muted">{{ "forgotSubtitle" | translate }}</p>

  @if (error()) {
    <p class="auth-error animate-shake">{{ error() | translate }}</p>
  }

  @if (!submitted()) {
    <form (ngSubmit)="onSubmit(); $event.preventDefault()" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="forgot-email">{{ "forgotEmail" | translate }}</label>
        <input
          type="email"
          id="forgot-email"
          class="form-input"
          placeholder="{{ 'forgotEmailPlaceholder' | translate }}"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          required
          maxlength="64"
        />
      </div>

      <button type="submit" class="btn btn-proceed" [disabled]="submitting()">
        @if (submitting()) {
          <span class="btn__spinner"></span>
        }
        {{ "forgotSubmit" | translate }}
      </button>
    </form>
  } @else {
    <div class="auth-success">
      <p class="auth-success__text">{{ "forgotSent" | translate }}</p>
    </div>
  }

  <div class="auth-actions">
    <a class="auth-link" routerLink="/login">{{ "forgotBackToLogin" | translate }}</a>
  </div>
</app-auth-shell>
