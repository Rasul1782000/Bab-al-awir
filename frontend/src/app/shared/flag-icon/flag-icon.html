@if (code() === "ae") {
  <svg viewBox="0 0 60 40" role="img" aria-label="UAE flag">
    <rect width="60" height="40" fill="#ffffff" />
    <rect x="0" y="0" width="15" height="40" fill="#ff0000" />
    <rect x="15" y="0" width="45" height="13.33" fill="#00732f" />
    <rect x="15" y="13.33" width="45" height="13.34" fill="#ffffff" />
    <rect x="15" y="26.67" width="45" height="13.33" fill="#111111" />
  </svg>
} @else if (code() === "sa") {
  <svg viewBox="0 0 60 40" role="img" aria-label="Saudi Arabia flag">
    <rect width="60" height="40" fill="#006c35" />
    <text
      x="30"
      y="16"
      text-anchor="middle"
      fill="white"
      font-size="9"
      font-weight="700"
      font-family="system-ui, sans-serif"
    >
      لا إله إلا الله
    </text>
    <text
      x="30"
      y="26"
      text-anchor="middle"
      fill="white"
      font-size="9"
      font-weight="700"
      font-family="system-ui, sans-serif"
    >
      محمد رسول الله
    </text>
    <g stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round">
      <line x1="20" y1="34" x2="40" y2="34" />
      <line x1="20" y1="34" x2="23" y2="38" />
      <line x1="27" y1="34" x2="30" y2="38" />
      <line x1="34" y1="34" x2="37" y2="38" />
    </g>
  </svg>
}
