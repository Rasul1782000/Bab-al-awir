services:
  # Laravel API (backend) — deployed via Docker since Render has no native PHP runtime
  - type: web
    name: bab-al-awir-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: sqlite

  # Angular SPA (frontend)
  - type: web
    name: bab-al-awir-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/bab-al-awir/browser
    envVars:
      - key: NODE_VERSION
        value: "24.15.0"
      - key: API_URL
        value: "https://bab-al-awir-api.onrender.com/api"
